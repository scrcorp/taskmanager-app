name: htm_core
description: HTM 공유 패키지 — 테마, 키오스크 락, 공통 위젯 등 staff/attendance 양쪽에서 쓰는 코드
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # api_error 파서는 공유 패키지에 있으므로 테스트도 여기 있어야 한다
  # (두 앱이 각자 복사해 테스트하면 그 순간 파서가 둘이 된다).
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
