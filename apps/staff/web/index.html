<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    모바일 필수. 없으면 iOS Safari 가 화면 폭을 980px 로 가정하고 페이지를 축소해
    레이아웃과 **탭 좌표가 어긋난다**(눌러도 안 눌리고 상단이 상태바에 물린다).
    이 앱에는 이 태그가 처음부터 없었다.

    viewport-fit=cover 가 있어야 Flutter 가 MediaQuery.padding 으로 안전영역
    (노치·다이내믹 아일랜드) 을 받는다. 없으면 그 값이 0 이라 헤더의 SafeArea 가
    비켜줄 여백을 계산하지 못한다.

    user-scalable 은 막지 않는다 — 확대를 봉인하면 저시력 사용자가 쓸 수 없다.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="HTM staff app — schedules, checklists, and daily reports.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    구형 iOS 는 표준 manifest 의 display:standalone 을 읽지 않고 이 apple- 접두 메타만
    본다. 없으면 홈 화면 아이콘을 눌러도 주소창이 있는 Safari 로 열려 앱처럼 보이지
    않는다(그 상태에서는 웹 푸시도 불가). 표준 메타와 함께 둘 다 유지한다.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HTM">
  <!--
    iOS 홈 화면 아이콘은 전용 불투명 이미지를 쓴다. 투명 영역이 있으면 iOS 가
    검정으로 합성해 모서리가 까맣게 나온다. 둥글리기는 iOS 가 직접 하므로
    원본은 각진 정사각이어야 한다.
  -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HTM</title>
  <link rel="manifest" href="manifest.json">

  <!--
    레거시 해시 URL 호환.

    이 앱은 오랫동안 해시 라우팅('/#/schedule')이었다. path 전략으로 바꾸면서
    기존 북마크·공유링크·홈화면 아이콘이 전부 홈으로 떨어지게 되므로, 부팅 전에
    한 번 경로로 바꿔 준다.

    Flutter 가 초기 경로를 읽기 전에 실행돼야 해서 인라인이다. replace 를 쓰는 건
    뒤로가기를 눌렀을 때 다시 해시 URL 로 돌아와 무한 왕복하는 걸 막기 위함이다.
  -->
  <script>
    (function () {
      var h = window.location.hash;
      if (h.indexOf('#/') !== 0) return;          // '#/...' 형태만 대상
      var route = h.slice(1);                     // '#/schedule' → '/schedule'
      if (route.charAt(1) === '/') return;        // '#//host' 같은 건 무시
      window.location.replace(route + window.location.search);
    })();
  </script>

  <!-- 웹 푸시 브리지 — Dart 가 window.htmPush 로 호출한다. Flutter 부팅 전에 정의돼야 한다. -->
  <script src="push_bridge.js"></script>

  <!--
    PWA 설치 브리지 — Flutter 로드 전에 실행되어야 한다.

    Chrome 계열은 설치 조건이 충족되면 beforeinstallprompt 를 딱 한 번 발화하는데,
    Flutter 엔진 부팅보다 먼저 뜨는 경우가 많다. 놓치면 그 세션에서는 두 번 다시
    받을 수 없으므로 여기서 이벤트를 붙잡아 window.htmPwa 에 보관해 둔다.
    Dart 쪽(pwa_install_helper_web.dart)이 나중에 이 객체를 읽어 간다.

    iOS Safari 는 beforeinstallprompt 자체가 없다 — 프로그래밍 방식 설치가
    불가능하므로 앱에서 수동 안내(공유 → 홈 화면에 추가)를 띄운다.
  -->
  <script>
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        // 크롬 기본 미니 배너를 막고 우리 UI 시점에 직접 띄운다.
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
      });

      window.htmPwa = {
        // 홈 화면 아이콘(또는 설치된 앱)으로 실행 중인가.
        // display-mode 는 표준, navigator.standalone 은 iOS Safari 전용.
        isStandalone: function () {
          return (
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true
          );
        },
        // 네이티브 설치 프롬프트를 띄울 수 있는 상태인가.
        canPrompt: function () {
          return deferred !== null;
        },
        // 네이티브 설치 프롬프트 실행 → 'accepted' | 'dismissed' | 'unavailable'.
        // 프롬프트는 1회용이라 호출 후 폐기한다.
        prompt: function () {
          if (deferred === null) return Promise.resolve('unavailable');
          var e = deferred;
          deferred = null;
          e.prompt();
          return e.userChoice.then(function (choice) {
            return choice && choice.outcome ? choice.outcome : 'dismissed';
          }).catch(function () {
            return 'dismissed';
          });
        },
        // iOS 계열(Safari/WebKit)인가 — 수동 안내가 필요한지 판단용.
        isIos: function () {
          var ua = window.navigator.userAgent || '';
          // iPadOS 13+ 는 Mac 으로 위장하므로 터치 지원 여부로 함께 판별한다.
          return (
            /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
          );
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
